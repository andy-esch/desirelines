syntax = "proto3";

package desirelines.sports.v1;

option go_package = "github.com/andy-esch/desirelines/packages/apigateway/types/generated";

// Single timeseries entry (date + value)
message MetricTimeseriesEntry {
  string date = 1;   // ISO date: "2024-01-15"
  double value = 2;  // Metric value
}

// Daily activity summary
message DailyActivity {
  // Distance in METERS (optional - not all sports have distance)
  // SI base unit: matches Strava API, no conversion errors
  optional double distance_meters = 1;

  // Time in minutes
  optional double time_minutes = 2;

  // Elevation gain in METERS (optional)
  optional double elevation_meters = 3;

  // Number of activities on this day
  int32 activities = 4;

  // Strava activity IDs
  repeated int64 activity_ids = 5;
}

// Daily summary for source files (activities/{year}/source/{sport}.json)
message DailySummary {
  // Map of date (YYYY-MM-DD) to daily activity data
  map<string, DailyActivity> daily = 1;
}

// Cumulative metrics entry (single date with all applicable metrics)
// Used for chart rendering - combines all metrics for a date
// Note: All values are cumulative (totals up to this date)
message CumulativeMetricsEntry {
  string date = 1;  // ISO date: "2025-01-01"

  // Cumulative distance (meters) - optional for sports without distance
  optional double distance = 2;

  // Cumulative elevation (meters) - optional for sports without elevation
  optional double elevation = 3;

  // Cumulative time (minutes) - all sports have time
  optional double time = 4;

  // Number of activities up to this date
  optional int32 activities = 5;
}

// Sport metrics file (activities/{year}/metrics/{sport}.json)
// Now uses clean array structure with combined metrics per date
message SportMetrics {
  // Cumulative metrics timeseries (single array with all metrics combined)
  repeated CumulativeMetricsEntry timeseries = 1;
}

// Metadata about the sport metrics
message SportMetadata {
  string sport = 1;          // "cycling", "running", "yoga"
  int32 year = 2;            // 2024
  repeated string available_metrics = 3;  // ["distance_meters", "time_minutes", ...]
  string primary_metric = 4;              // "distance_meters"
}

// Sport totals for a year
message SportTotals {
  optional double distance_meters = 1;
  optional double time_minutes = 2;
  optional double elevation_meters = 3;
  int32 activities = 4;
}

// Year metadata file (activities/{year}/metadata.json)
message YearMetadata {
  int32 year = 1;
  repeated string sports = 2;                    // ["cycling", "running", "yoga"]
  map<string, SportTotals> totals = 3;          // Per-sport totals
  string last_updated = 4;                       // ISO timestamp
  string aggregation_version = 5;                // "1.0"
}
