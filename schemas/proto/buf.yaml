version: v1

lint:
  use:
    - STANDARD

breaking:
  use:
    - WIRE_JSON
  ignore_only:
    # bq_activities.proto is generated from the BQ table schema and is only
    # ever serialized as binary protobuf for the BigQuery Storage Write API
    # (never marshaled as JSON). The file uses proto2 syntax (required by
    # the Storage Write API), which buf flags as a JSON-format change vs
    # the previous proto3 version. The JSON-format check is meaningful for
    # protos that travel over JSON; this one does not.
    MESSAGE_SAME_JSON_FORMAT:
      - desirelines/bigquery/v1/bq_activities.proto

# Buf configuration for Desirelines protobuf schemas
#
# Lint (STANDARD) includes:
#   - MINIMAL: Critical rules (e.g., valid syntax, no name conflicts)
#   - BASIC: Common best practices (e.g., field naming conventions)
#   - DEFAULT: Documentation and style requirements
#
# Breaking (WIRE_JSON) detects changes that break:
#   - Wire format compatibility (field numbers, types, wire types)
#   - JSON serialization compatibility (field names, enum value names)
#   All three languages (Go, Python, TypeScript) use JSON marshaling.
