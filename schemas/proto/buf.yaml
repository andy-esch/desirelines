version: v1

lint:
  use:
    - STANDARD
  ignore_only:
    # BigQuery names the CDC pseudocolumns `_CHANGE_TYPE` and
    # `_CHANGE_SEQUENCE_NUMBER`; the subscription matches on those exact
    # names, so they cannot be lower_snake_case. Scoped to the one generated
    # file that carries them rather than relaxing the rule everywhere.
    FIELD_LOWER_SNAKE_CASE:
      - desirelines/bigquery/cdc/v1/bq_activity_rows.proto

breaking:
  use:
    - WIRE_JSON
  ignore_only:
    # bq_activities.proto is generated from the BQ table schema and is only
    # ever serialized as binary protobuf for the BigQuery Storage Write API
    # (never marshaled as JSON). The file uses proto2 syntax (required by
    # the Storage Write API), which buf flags as a JSON-format change vs
    # the previous proto3 version. The JSON-format check is meaningful for
    # protos that travel over JSON; this one does not.
    MESSAGE_SAME_JSON_FORMAT:
      - desirelines/bigquery/v1/bq_activities.proto

    # bq_activity_rows.proto briefly labeled its primary key `required` and now
    # does not, so buf sees a cardinality change in both directions across the
    # two commits. Neither is a real break: no message was ever published under
    # the `required` cardinality — Pub/Sub refused the schema revision, which is
    # why it was reverted — and the sole producer always sets the key.
    #
    # Retained rather than removed because buf compares against main, which
    # still carries the `required` revision. Drop both entries once main has
    # settled on the optional form.
    FIELD_WIRE_JSON_COMPATIBLE_CARDINALITY:
      - desirelines/bigquery/cdc/v1/bq_activity_rows.proto
    MESSAGE_SAME_REQUIRED_FIELDS:
      - desirelines/bigquery/cdc/v1/bq_activity_rows.proto

# Buf configuration for Desirelines protobuf schemas
#
# Lint (STANDARD) includes:
#   - MINIMAL: Critical rules (e.g., valid syntax, no name conflicts)
#   - BASIC: Common best practices (e.g., field naming conventions)
#   - DEFAULT: Documentation and style requirements
#
# Breaking (WIRE_JSON) detects changes that break:
#   - Wire format compatibility (field numbers, types, wire types)
#   - JSON serialization compatibility (field names, enum value names)
#   All three languages (Go, Python, TypeScript) use JSON marshaling.
