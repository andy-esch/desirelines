syntax = "proto3";

package desirelines.webhook.v1;

// Go code generated to dispatcher for webhook handling
// Python code generated to stravapipe for webhook processing
// Cross-package type mapping: see docs/architecture/domain-model.md
option go_package = "github.com/andy-esch/desirelines/packages/dispatcher/types/generated";

// AspectType represents the type of change in a webhook event.
enum AspectType {
  // Unknown aspect type (proto3 default).
  ASPECT_TYPE_UNSPECIFIED = 0;

  // A new resource was created.
  ASPECT_TYPE_CREATE = 1;

  // An existing resource was updated.
  ASPECT_TYPE_UPDATE = 2;

  // A resource was deleted.
  ASPECT_TYPE_DELETE = 3;
}

// ObjectType represents the type of Strava object in a webhook event.
enum ObjectType {
  // Unknown object type (proto3 default).
  OBJECT_TYPE_UNSPECIFIED = 0;

  // Activity object (run, ride, swim, etc.).
  OBJECT_TYPE_ACTIVITY = 1;

  // Athlete object (user profile).
  OBJECT_TYPE_ATHLETE = 2;
}

// ActivityUpdates contains the fields that can be updated on an activity.
// See: https://developers.strava.com/docs/webhooks/
message ActivityUpdates {
  // New activity title/name (if changed).
  optional string title = 1;

  // New activity type, e.g., "Ride", "Run" (if changed).
  optional string type = 2;

  // New visibility setting (if changed).
  // Note: Not currently used by this application.
  optional bool private = 3;
}

// WebhookEvent represents a Strava webhook notification.
// This is the canonical definition used by both dispatcher (Go) and stravapipe (Python).
// See: https://developers.strava.com/docs/webhooks/
message WebhookEvent {
  // The type of change (create, update, delete).
  AspectType aspect_type = 1;

  // The type of object (activity, athlete).
  ObjectType object_type = 2;

  // Unique identifier for the object.
  // For activity events, the activity's ID. For athlete events, the athlete's ID.
  int64 object_id = 3;

  // Unique identifier for the athlete/owner.
  int64 owner_id = 4;

  // Unix timestamp of when the event occurred.
  int64 event_time = 5;

  // Strava webhook subscription ID.
  int32 subscription_id = 6;

  // Activity-specific updates for ASPECT_TYPE_UPDATE events on activities.
  // Only populated when object_type is OBJECT_TYPE_ACTIVITY and aspect_type is ASPECT_TYPE_UPDATE.
  optional ActivityUpdates updates = 7;
}

// EnrichedEvent wraps a WebhookEvent with optional activity data.
// raw_activity contains the full Strava API response (JSON bytes) for CREATE
// events and for type-change UPDATE events (the dispatcher re-fetches the
// activity so downstream can recover the granular sport_type the webhook
// omits). It is not set for title/private-only UPDATEs or for DELETE events.
message EnrichedEvent {
  // The original webhook event with all metadata.
  WebhookEvent event = 1;

  // Raw Strava API JSON response for the activity. Populated for CREATE events
  // and type-change UPDATE events; absent for bare UPDATEs and DELETEs.
  optional bytes raw_activity = 2;
}

// WebhookVerificationRequest represents the initial webhook verification challenge.
// Strava sends this when setting up a webhook subscription.
message WebhookVerificationRequest {
  // Hub mode (should be "subscribe").
  string hub_mode = 1;

  // Challenge string to echo back.
  string hub_challenge = 2;

  // Verification token to validate.
  string hub_verify_token = 3;
}

// WebhookVerificationResponse is sent in response to verification.
message WebhookVerificationResponse {
  // Echo back the challenge string.
  string hub_challenge = 1;
}
