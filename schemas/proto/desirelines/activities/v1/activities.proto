syntax = "proto3";

package desirelines.activities.v1;

// Go code generated to apigateway for activity handling
// Cross-package type mapping: see docs/architecture/domain-model.md
option go_package = "github.com/andy-esch/desirelines/packages/apigateway/types/generated/activitiesv1";

// =============================================================================
// Resource Definitions
// =============================================================================

// Activity represents a single activity with full details.
// Used for GET /activities/{id} responses.
message Activity {
  // Strava activity ID.
  int64 id = 1;

  // Activity name/title.
  string name = 2;

  // Strava 'type' field: broad/deprecated category (Run, Ride, Workout, Swim, etc.).
  // Note: multiple sport_types share the same type (e.g., Yoga → type "Workout").
  string type = 3;

  // App sport category (running, cycling, yoga).
  // Mapped from Strava's sport_type via sport_types.json config.
  string sport = 4;

  // Local start time as ISO 8601 timestamp.
  string start_date_local = 5;

  // Distance in meters.
  double distance_meters = 6;

  // Moving time in seconds.
  int32 moving_time_seconds = 7;

  // Total elapsed time in seconds.
  int32 elapsed_time_seconds = 8;

  // Elevation gain in meters (nullable).
  optional double elevation_meters = 9;

  // Average speed in m/s (nullable).
  optional double average_speed_mps = 10;

  // Max speed in m/s (nullable).
  optional double max_speed_mps = 11;

  // Average heart rate in bpm (nullable).
  optional double average_heartrate = 12;

  // Max heart rate in bpm (nullable).
  optional double max_heartrate = 13;
}

// ActivitySummary represents a condensed activity for list views.
// Omits detailed stats not needed in list/table displays.
message ActivitySummary {
  // Strava activity ID.
  int64 id = 1;

  // Activity name/title.
  string name = 2;

  // Strava 'type' field: broad/deprecated category (Run, Ride, Workout, Swim, etc.).
  string type = 3;

  // App sport category (running, cycling, yoga).
  // Mapped from Strava's sport_type via sport_types.json config.
  string sport = 4;

  // Local start time as ISO 8601 timestamp.
  string start_date_local = 5;

  // Distance in meters.
  double distance_meters = 6;

  // Moving time in seconds.
  int32 moving_time_seconds = 7;

  // Elevation gain in meters (nullable).
  optional double elevation_meters = 8;
}

// MapActivity is a single geo-bearing activity for the routes-map cross-filter
// dataset: scalar attributes plus the region tag ids it belongs to. Returned by
// GET /activities/map/dataset. Only activities with >=1 region tag are included
// (virtual/indoor activities are excluded), matching the /map/tiles and
// /map/regions inclusion rule.
message MapActivity {
  // Strava activity ID.
  int64 activity_id = 1;

  // Activity name/title (for the cross-filter activity list + click popover).
  string name = 9;

  // App sport category (running, cycling, yoga).
  // Mapped from Strava's sport_type via sport_types.json config.
  string sport = 2;

  // Distance in meters.
  double distance_meters = 3;

  // Moving time in seconds.
  int32 moving_time = 4;

  // Elevation gain in meters (nullable).
  optional double elevation_meters = 5;

  // Local start time as ISO 8601 timestamp.
  string start_date_local = 6;

  // Region ids this activity is tagged to. Same ids as GET /map/regions
  // returns (the desirelines.regions surrogate id), so the client can label
  // and filter consistently.
  repeated int64 region_ids = 7;

  // Optional per-activity bounding box [minLng, minLat, maxLng, maxLat] from
  // the activity's route geometry, for map "fit to results". Absent when the
  // activity has no stored route geometry.
  repeated double bbox = 8;
}

// MapDatasetResponse wraps the full set of geo-bearing activities for the
// routes-map cross-filter model. No pagination: the client holds the whole set
// and filters it in-memory.
message MapDatasetResponse {
  // All geo-bearing activities with scalars + region tag ids.
  repeated MapActivity activities = 1;
}

// =============================================================================
// List Activities
// =============================================================================

// ListActivitiesRequest contains filters for listing activities.
// Used for GET /activities endpoint.
message ListActivitiesRequest {
  // Start date filter (YYYY-MM-DD), inclusive.
  optional string from = 1;

  // End date filter (YYYY-MM-DD), inclusive.
  optional string to = 2;

  // Sport filter (cycling, running, yoga).
  optional string sport = 3;

  // Maximum number of results to return (default: 50, max: 100).
  optional int32 limit = 4;

  // Pagination cursor from previous response.
  optional string cursor = 5;
}

// ListActivitiesResponse contains a paginated list of activities.
message ListActivitiesResponse {
  // List of activity summaries.
  repeated ActivitySummary activities = 1;

  // Opaque cursor for fetching the next page.
  // Empty/absent if no more results.
  optional string next_cursor = 2;

  // True if more results are available.
  bool has_more = 3;
}

// =============================================================================
// Get Activity
// =============================================================================

// GetActivityRequest identifies a single activity to retrieve.
// Used for GET /activities/{id} endpoint.
message GetActivityRequest {
  // Strava activity ID.
  int64 id = 1;
}

// GetActivityResponse wraps the activity response.
// Note: Could return Activity directly, but wrapper allows future metadata.
message GetActivityResponse {
  // The requested activity.
  Activity activity = 1;
}

