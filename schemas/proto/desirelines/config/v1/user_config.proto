syntax = "proto3";

package desirelines.config.v1;

// Cross-package type mapping: see docs/architecture/domain-model.md
option go_package = "github.com/andy-esch/desirelines/packages/apigateway/types/generated";

// Top-level user configuration stored in Firestore
// Document path: users/{userId}/config/v1
message UserConfig {
  string schema_version = 1; // "2.0"
  string user_id = 2;
  string last_updated = 3; // RFC3339 timestamp

  map<string, SportGoalsForYear> goals = 10; // key = year (e.g., "2025")
  map<string, AnnotationsForYear> annotations = 11;
  Preferences preferences = 12;
  Metadata metadata = 13;
}

// Goals organized by sport for a specific year
message SportGoalsForYear {
  map<string, GoalsForYear> sports = 1; // key = sport (e.g., "cycling", "running", "yoga")
}

// Goals for a specific sport in a specific year
message GoalsForYear {
  repeated Goal goals = 1;
}

// A single goal with a target value
// UNIT CONVENTIONS:
// - For distance-based sports (cycling, running, etc.): value is in METERS
// - For time-based sports (yoga, workout, etc.): value is in MINUTES
// - For session-based sports: value is the number of sessions
// The frontend converts to display units (miles/km, hours) based on user preferences.
// The `metric` field records which metric this goal tracks (e.g., "distance_meters",
// "time_minutes", "activities"). Empty string means legacy goal — infer from sport config.
message Goal {
  string id = 1;
  int32 value = 2; // See UNIT CONVENTIONS above
  string label = 3;
  string created_at = 4; // RFC3339 timestamp
  string updated_at = 5; // RFC3339 timestamp
  string metric = 6; // e.g., "distance_meters", "time_minutes", "activities"
}

// Annotations for a specific year
message AnnotationsForYear {
  repeated Annotation annotations = 1;
}

message Annotation {
  string id = 1;
  string start_date = 2; // ISO date: "2025-07-14"
  string end_date = 3; // Optional, empty for single-day
  string label = 4;
  string description = 5;
  string strava_activity_id = 6; // Optional link
  AnnotationType type = 7;
  string created_at = 8; // RFC3339 timestamp
  string updated_at = 9; // RFC3339 timestamp
}

enum AnnotationType {
  ANNOTATION_TYPE_UNSPECIFIED = 0;
  ANNOTATION_TYPE_EVENT = 1;
  ANNOTATION_TYPE_PERIOD = 2;
  ANNOTATION_TYPE_NOTE = 3;
}

// User preferences (global, not year-specific)
message Preferences {
  string theme = 1; // "light" or "dark"
  int32 default_year = 2;
  ChartDefaults chart_defaults = 3;

  // Unit preferences (backward-compatible additions - no schema version bump needed)
  string distance_unit = 4; // "miles", "kilometers", "meters" (default: "miles")
  string elevation_unit = 5; // "feet", "meters" (default: "feet")
  string default_sport = 6; // "cycling", "running", "yoga" (default: "cycling")

  // Timezone for display (IANA format, e.g., "America/New_York")
  // Default: browser timezone
  string timezone = 7;

  // Sports to show in the UI (default: ["cycling", "running", "yoga"])
  // Empty array treated as default. Invalid keys filtered on read.
  repeated string visible_sports = 8;
}

message ChartDefaults {
  bool show_average = 1;
  bool show_goals = 2;
}

// Metadata about the config itself
message Metadata {
  string created_at = 1; // RFC3339 timestamp
  string last_synced_device = 2;
  repeated string config_types = 3; // ["goals", "annotations", "preferences"]
}
