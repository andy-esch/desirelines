# Flyway configuration for Desirelines PostgreSQL migrations
# Environment variables are expanded at runtime

# PostgreSQL connection settings
flyway.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
flyway.user=${DB_USER}
flyway.password=${DB_PASSWORD}

# Migration settings
# SQL callbacks (beforeMigrate.sql, etc.) are discovered from locations automatically
flyway.locations=filesystem:/flyway/sql,filesystem:/flyway/callbacks
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
flyway.validateOnMigrate=true
flyway.defaultSchema=desirelines
flyway.cleanDisabled=false

# PostgreSQL-specific settings
flyway.placeholderReplacement=false
flyway.mixed=false
