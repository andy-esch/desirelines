name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress CI runs when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test environment variables (needed for Python tests)
  GCP_PROJECT_ID: "test-project"
  GCP_BIGQUERY_DATASET: "test_dataset"
  GCP_BUCKET_NAME: "test-bucket"
  GCP_PUBSUB_TOPIC: "test-topic"
  STRAVA_CLIENT_ID: "123"
  STRAVA_CLIENT_SECRET: "test_secret"
  STRAVA_REFRESH_TOKEN: "test_token"
  STRAVA_WEBHOOK_VERIFY_TOKEN: "test_verify_token"
  STRAVA_WEBHOOK_SUBSCRIPTION_ID: "12345"

jobs:
  # ===========================================================================
  # Validation: Schema sync, Proto validation, BUILD files
  # Fast checks first, slow BUILD check last (fail fast strategy)
  # ===========================================================================
  validation:
    name: Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Fast checks first (fail fast) ---

      - name: Verify schemas are in sync
        run: just verify-schemas

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Lint proto files
        run: just proto-lint

      # --- Slow check last (~4 min) ---

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.work.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Pants
        uses: pantsbuild/actions/init-pants@v10
        with:
          gha-cache-key: v1-validation
          named-caches-hash: ${{ hashFiles('pants.toml') }}

      - name: Verify BUILD files
        run: "pants tailor --check ::"

  # ===========================================================================
  # Python: Test, Lint, Type check (via Pants)
  # ===========================================================================
  pants-python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Go needed for pants
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.work.sum

      - name: Set up Pants
        uses: pantsbuild/actions/init-pants@v10
        with:
          gha-cache-key: v1-ci-python
          named-caches-hash: ${{ hashFiles('packages/stravapipe/uv.lock', 'pants.toml') }}
          cache-lmdb-store: true
          base-branch: main

      - name: Test with coverage
        run: "pants --tag='-integration' test --use-coverage packages/stravapipe::"

      - name: Upload Python coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./dist/coverage/python/coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false

      - name: Lint
        run: "pants lint packages/stravapipe::"

      - name: Type check
        run: "pants check packages/stravapipe::"

  # ===========================================================================
  # Go: Test, Lint, Format check (combined for efficiency)
  # Matrix runs packages in parallel
  # ===========================================================================
  go-quality:
    name: Go (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [dispatcher, apigateway]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.work.sum

      - name: Download dependencies
        run: go work sync && go mod download

      - name: Run tests with coverage
        run: |
          cd packages/${{ matrix.package }}
          go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/${{ matrix.package }}/coverage.out
          flags: go-${{ matrix.package }}
          name: go-${{ matrix.package }}-coverage
          fail_ci_if_error: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: packages/${{ matrix.package }}
          args: --timeout=5m

      - name: Check Go formatting
        run: |
          cd packages/${{ matrix.package }}
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "❌ The following files need formatting:"
            echo "$unformatted"
            exit 1
          fi

  # ===========================================================================
  # Web/React: Test, Lint, Format, Type check, Build
  # ===========================================================================
  web-quality:
    name: Web/React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/web/coverage/lcov.info
          flags: web
          name: web-coverage
          fail_ci_if_error: false

      - name: Build
        run: npm run build

  # ===========================================================================
  # Terraform: Format, Init, Validate
  # ===========================================================================
  terraform-validate:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"

      - name: Validate all environments
        run: |
          for env in artifacts dev prod; do
            echo "Validating $env environment..."
            cd terraform/environments/$env
            terraform fmt -check
            terraform init -backend=false
            terraform validate
            cd ../../..
          done

      - name: Validate module
        run: |
          cd terraform/modules/desirelines
          terraform fmt -check
          terraform init -backend=false
          terraform validate
