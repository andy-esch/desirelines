name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress CI runs when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the Python CI runs on. Must track
  # packages/stravapipe/pyproject.toml's `requires-python` and pants.toml's
  # `[python] interpreter_constraints` — a stale value here doesn't fail
  # loudly, it silently tests a different interpreter than we ship, or
  # (for the audit step) picks wheels whose hashes aren't in the export.
  # Minor version only: setup-python resolves it to the newest available
  # patch, so a patch release can't break CI.
  PYTHON_VERSION: "3.14"

  # Same deal for Go. Must track the `go` directive in the go.mod files,
  # pants.toml's `[golang] minimum_expected_version`, and the `golang:` base
  # images in the service Dockerfiles. Note `[golangci-lint] version` is
  # coupled too — golangci-lint only supports Go versions <= the one it was
  # built with, so bumping this without bumping that panics the linter.
  GO_VERSION: "1.26"

  # Test environment variables (needed for Python tests)
  GCP_PROJECT_ID: "test-project"
  GCP_BIGQUERY_DATASET: "test_dataset"
  GCP_BUCKET_NAME: "test-bucket"
  GCP_PUBSUB_TOPIC: "test-topic"
  STRAVA_CLIENT_ID: "123"
  STRAVA_CLIENT_SECRET: "test_secret"
  STRAVA_WEBHOOK_VERIFY_TOKEN: "test_verify_token"
  STRAVA_WEBHOOK_SUBSCRIPTION_ID: "12345"

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Validation: Schema sync, Proto validation, BUILD files
  # Fast checks first, slow BUILD check last (fail fast strategy)
  # ===========================================================================
  validation:
    name: Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # --- Fast checks first (fail fast) ---

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'
          config: '.github/.markdownlint-cli2.yaml'

      - name: Check Markdown links
        uses: tcort/github-action-markdown-link-check@v1
        with:
          config-file: '.github/mlc_config.json'
          folder-path: '.'
          use-quiet-mode: 'yes'

      - name: Validate OpenAPI spec
        run: npx --yes @redocly/cli lint packages/apigateway/openapi.yaml --format=github-actions

      - name: Set up Just
        uses: extractions/setup-just@v4

      - name: Verify schemas are in sync
        run: just verify-schemas

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Lint proto files
        run: just proto-lint

      - name: Check proto formatting
        run: just proto-fmt-check

      - name: Check proto breaking changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main:main --depth=1
          just proto-breaking

      # --- Slow check last (~4 min) ---

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.work.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Pants
        uses: pantsbuild/actions/init-pants@v11
        with:
          gha-cache-key: v1-validation
          named-caches-hash: ${{ hashFiles('packages/*/go.sum', 'packages/stravapipe/uv.lock', 'go.work.sum', 'pants.toml') }}
          cache-lmdb-store: true

      - name: Verify BUILD files
        run: "pants tailor --check ::"

      # Shellcheck (preinstalled on ubuntu-latest) + shfmt format check.
      # shfmt is installed via `go install` since Go is already set up
      # above. Catches hardening / formatting regressions in scripts/ +
      # local-dev/ at PR time; locally use `just sh-lint` and
      # `just sh-format`. See justfiles/scripts.just for the recipes.
      - name: Install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.10.0

      - name: Verify shell scripts (lint + format)
        run: |
          just sh-lint
          just sh-format-check

      # Catches Renovate / hand-tidy drift across workspace members
      # (each `go.mod`+`go.sum` and `go.work.sum`) at PR time. If this
      # fails, the contributor should run `just go-tidy-fix` and commit
      # the result. See justfiles/backend.just for the matching recipes.
      - name: Verify Go workspace is tidy
        run: just go-tidy-check


  # ===========================================================================
  # Python: Test, Lint, Type check (via Pants)
  # ===========================================================================
  pants-python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Go needed for pants
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.work.sum

      - name: Set up Pants
        uses: pantsbuild/actions/init-pants@v11
        with:
          gha-cache-key: v1-ci-python
          named-caches-hash: ${{ hashFiles('packages/stravapipe/uv.lock', 'pants.toml') }}
          cache-lmdb-store: true
          base-branch: main

      # Needed by the dependency-audit step below; Pants vendors its own Python
      # env and does not put `uv` on PATH. Same action/version the
      # integration-tests job uses.
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # Without this, setup-uv installs whatever uv is newest that day.
          # pyproject.toml isn't at the repo root, so the action's default
          # search wouldn't find it - point at it explicitly.
          version-file: packages/stravapipe/pyproject.toml

      - name: Test with coverage
        run: "pants --tag='-integration' test --use-coverage packages/stravapipe::"

      # fail_ci_if_error is false on every codecov step: this flag governs the
      # *upload*, not coverage thresholds (those stay enforced by Codecov's own
      # status checks). Leaving it true made a Codecov outage or rate-limit able to
      # block a merge — seven separate third-party dependencies on the critical path
      # for information that is advisory.
      - name: Upload Python coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./dist/coverage/python/coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false

      - name: Lint
        run: "pants lint packages/stravapipe::"

      - name: Type check
        run: "pants check packages/stravapipe::"

      # Supply-chain gate: fail on a known-vulnerable dependency rather than
      # waiting for a Dependabot PR. Audits the resolved lockfile, so it sees
      # transitive pins too — which is where the real exposure lives (the
      # starlette CVEs were pinned by a functions-framework upper bound, not by
      # anything this project declares).
      - name: Audit Python dependencies
        working-directory: packages/stravapipe
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/reqs.txt
          # --no-deps: the export is already fully pinned, so re-resolving would only
          # add a venv build (which is also where pip-audit is most fragile).
          # $PYTHON_VERSION, not a literal: the export carries hashes only for
          # wheels valid on the project's interpreter, so auditing under an
          # older one makes pip select e.g. the cp313 psycopg-binary wheel and
          # fail the hash check against a cp314-only hash list.
          uvx --python "$PYTHON_VERSION" pip-audit --requirement /tmp/reqs.txt --no-deps --strict

  # ===========================================================================
  # Go: Test, Lint, Format check (combined for efficiency)
  # Matrix runs packages in parallel
  # ===========================================================================
  go-quality:
    name: Go (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [dispatcher, apigateway, shared]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.work.sum

      - name: Download dependencies
        run: go work sync && go mod download

      - name: Run tests with coverage
        # -coverpkg=./... attributes coverage across every package in the module
        # the tests exercise, so cross-package test infrastructure (e.g. mocks in
        # ports/portstest/ driven by sibling-package tests) counts in Codecov
        # instead of reading 0%.
        run: |
          cd packages/${{ matrix.package }}
          go test -v -race -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/${{ matrix.package }}/coverage.out
          flags: go-${{ matrix.package }}
          name: go-${{ matrix.package }}-coverage
          fail_ci_if_error: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: packages/${{ matrix.package }}
          args: --timeout=5m

      # Flags any `*pubsub.Publisher.Publish(...)` call not paired with a
      # `propagator.Inject(...)` in the same function — catches the
      # "new publish path forgot trace-context injection" regression
      # class at PR time. Source: packages/shared/otel/lintpub/.
      - name: Run trace-propagation analyzer (lintpub)
        run: |
          go build -o /tmp/lintpub ./packages/shared/cmd/lintpub
          cd packages/${{ matrix.package }}
          /tmp/lintpub ./...

      - name: Check Go formatting
        run: |
          cd packages/${{ matrix.package }}
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "❌ The following files need formatting:"
            echo "$unformatted"
            exit 1
          fi

  # ===========================================================================
  # Web/React: Test, Lint, Format, Type check, Build
  # ===========================================================================
  web-quality:
    name: Web/React
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./packages/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/web/coverage/lcov.info
          flags: web
          name: web-coverage
          fail_ci_if_error: false

      # Verified clean at time of adding, so this gates rather than blocks.
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: 'true'

  # ===========================================================================
  # Integration Tests: Go + Python against real PostgreSQL
  # Shared ephemeral DB — tmpfs-backed, non-durable for speed
  # ===========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Boots a Postgres container; cap wall-clock so a hung DB/test can't ride the
    # 6h default. Healthy runs finish in well under a minute.
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.work.sum

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # See the note on the pants-python job's "Set up uv" step.
          version-file: packages/stravapipe/pyproject.toml
          enable-cache: true
          cache-dependency-glob: packages/stravapipe/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Start optimized Postgres
        run: |
          docker run -d \
            --name postgres \
            -p 5432:5432 \
            --mount type=tmpfs,destination=/var/lib/postgresql/data \
            -e POSTGRES_DB=desirelines_test \
            -e POSTGRES_USER=desirelines \
            -e POSTGRES_PASSWORD=test_password \
            postgis/postgis:17-3.6-alpine \
            postgres \
              -c fsync=off \
              -c full_page_writes=off \
              -c synchronous_commit=off

          until docker exec postgres pg_isready -U desirelines; do
            sleep 0.5
          done

      - name: Run Flyway migrations
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/schemas/database/migrations:/flyway/sql \
            -v ${{ github.workspace }}/schemas/database/callbacks:/flyway/callbacks \
            flyway/flyway \
            -url="jdbc:postgresql://localhost:5432/desirelines_test" \
            -user="desirelines" \
            -password="test_password" \
            -defaultSchema="desirelines" \
            -locations="filesystem:/flyway/sql,filesystem:/flyway/callbacks" \
            -baselineOnMigrate=true \
            -baselineVersion=0 \
            -placeholderReplacement=false \
            migrate

      - name: Go integration tests
        working-directory: packages/apigateway
        env:
          POSTGRES_CONNECTION_STRING: "postgresql://desirelines:test_password@localhost:5432/desirelines_test?search_path=desirelines,extensions,public&application_name=integration-test"
        # -coverpkg=./... attributes coverage across all apigateway packages the
        # integration tests exercise (e.g. the repository SQL), so it counts in
        # Codecov instead of looking uncovered.
        run: go test -tags=integration -v -race -coverpkg=./... -coverprofile=coverage.integration.out ./adapters/postgres/...

      - name: Upload Go integration coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/apigateway/coverage.integration.out
          flags: go-apigateway-integration
          name: go-apigateway-integration-coverage
          fail_ci_if_error: false

      - name: Install Python dependencies
        working-directory: packages/stravapipe
        run: uv sync --extra dev

      - name: Python integration tests
        working-directory: packages/stravapipe
        run: |
          uv run pytest tests/integration/ -v \
            --cov=stravapipe --cov-report=xml:coverage.integration.xml \
            --db-url="postgresql+psycopg://desirelines:test_password@localhost:5432/desirelines_test?options=-csearch_path%3Ddesirelines,extensions,public"

      - name: Upload Python integration coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/stravapipe/coverage.integration.xml
          flags: python-integration
          name: python-integration-coverage
          fail_ci_if_error: false

  # ===========================================================================
  # Firestore Integration Tests: Go (Admin SDK) + Web (client SDK)
  # Both run against ONE Firebase emulator container. Runs parallel to the
  # Postgres integration-tests job above (parallelize by service).
  # The emulator image is the project's local-dev image, built with GHA layer
  # caching; firestore.rules + ci-firebase.json are mounted so the client-SDK
  # security tests run against real rules. See
  # local-dev/containers/firebase-emulators/.
  # ===========================================================================
  firestore-integration-tests:
    name: Firestore Integration Tests
    runs-on: ubuntu-latest
    # Boots an emulator container + npm ci; cap wall-clock so a hung emulator
    # can't ride the 6h default. Healthy runs finish in ~1-2 min.
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.work.sum

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/web/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the emulator image with GHA layer caching so repeat runs skip the
      # ~1GB firebase-tools/Java install. load:true makes it available to
      # `docker run` below.
      - name: Build Firebase emulator image
        uses: docker/build-push-action@v7
        with:
          context: local-dev/containers/firebase-emulators
          load: true
          tags: firebase-emulators:ci
          cache-from: type=gha,scope=firebase-emulators
          cache-to: type=gha,scope=firebase-emulators,mode=max

      # One emulator serves both Go (Admin SDK, rules bypassed) and web (client
      # SDK, rules enforced). Mount firestore.rules + the in-repo ci-firebase.json
      # that references them, publish firestore on host 8080 (the web setup
      # hardcodes 8080/9099), and start as demo-test-project (the project the web
      # client expects, or auth tokens won't validate against the rules context).
      - name: Start Firebase emulator
        run: |
          docker run -d --name firebase-emulators \
            -p 8080:8080 -p 9099:9099 \
            -v "${{ github.workspace }}/firestore.rules:/app/firestore.rules:ro" \
            -v "${{ github.workspace }}/local-dev/containers/firebase-emulators/ci-firebase.json:/app/firebase.json:ro" \
            firebase-emulators:ci \
            firebase emulators:start --only auth,firestore --project demo-test-project

      - name: Wait for emulator
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ >/dev/null; then
              echo "Firestore emulator ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Firestore emulator did not become ready" >&2
          docker logs firebase-emulators
          exit 1

      - name: Download Go dependencies
        run: go work sync && go mod download

      # Admin SDK bypasses rules, so these are project-agnostic; -coverpkg=./...
      # attributes the Firestore adapter coverage that unit-only runs miss.
      - name: Go Firestore integration tests
        env:
          FIRESTORE_EMULATOR_HOST: "localhost:8080"
          GCP_PROJECT_ID: "demo-test-project"
          FIRESTORE_DATABASE: "(default)"
        run: |
          (cd packages/apigateway && go test -tags=integration -v -race -coverpkg=./... -coverprofile=coverage.firestore.out ./adapters/firestore/...)
          (cd packages/dispatcher && go test -tags=integration -v -race -coverpkg=./... -coverprofile=coverage.firestore.out ./adapters/firestore/...)
          (cd packages/shared && go test -tags=integration -v -race -coverpkg=./... -coverprofile=coverage.firestore.out ./allowlist/...)

      - name: Upload Go Firestore integration coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/apigateway/coverage.firestore.out,./packages/dispatcher/coverage.firestore.out,./packages/shared/coverage.firestore.out
          flags: go-firestore-integration
          name: go-firestore-integration-coverage
          fail_ci_if_error: false

      - name: Install web dependencies
        working-directory: packages/web
        run: npm ci

      # Run vitest DIRECTLY against the shared container — NOT
      # `npm run test:integration`, which spins its own emulator via
      # emulators:exec and needs firebase-tools + Java on the runner.
      - name: Web integration tests
        working-directory: packages/web
        run: npx vitest run --config vitest.integration.config.ts --coverage

      - name: Upload web integration coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/web/coverage-integration/lcov.info
          flags: web-integration
          name: web-integration-coverage
          fail_ci_if_error: false

  # ===========================================================================
  # Terraform: Format, Init, Validate
  # ===========================================================================
  terraform-validate:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read Terraform version
        id: tf-version
        run: echo "version=$(cat terraform/.terraform-version)" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}

      - name: Validate all environments
        run: |
          for env in artifacts; do
            echo "Validating $env environment..."
            cd terraform/environments/$env
            terraform fmt -check
            terraform init -backend=false
            terraform validate
            cd ../../..
          done

      - name: Validate module
        run: |
          cd terraform/modules/desirelines
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.55.0

      - name: Lint Terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for dir in terraform/modules/desirelines terraform/modules/github-actions-wif terraform/environments/artifacts; do
            echo "Linting $dir..."
            cd "$dir"
            tflint --init --config="$(git rev-parse --show-toplevel)/terraform/.tflint.hcl"
            tflint --config="$(git rev-parse --show-toplevel)/terraform/.tflint.hcl"
            cd "$(git rev-parse --show-toplevel)"
          done

      - name: Setup terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.19.0/terraform-docs-v0.19.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz terraform-docs
          sudo mv terraform-docs /usr/local/bin/
