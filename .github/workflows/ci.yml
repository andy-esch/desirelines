name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress CI runs when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test environment variables (needed for Python tests)
  GCP_PROJECT_ID: "test-project"
  GCP_BIGQUERY_DATASET: "test_dataset"
  GCP_BUCKET_NAME: "test-bucket"
  GCP_PUBSUB_TOPIC: "test-topic"
  STRAVA_CLIENT_ID: "123"
  STRAVA_CLIENT_SECRET: "test_secret"
  STRAVA_WEBHOOK_VERIFY_TOKEN: "test_verify_token"
  STRAVA_WEBHOOK_SUBSCRIPTION_ID: "12345"

jobs:
  # ===========================================================================
  # Validation: Schema sync, Proto validation, BUILD files
  # Fast checks first, slow BUILD check last (fail fast strategy)
  # ===========================================================================
  validation:
    name: Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # --- Fast checks first (fail fast) ---

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          globs: '**/*.md'
          config: '.github/.markdownlint-cli2.yaml'

      - name: Check Markdown links
        uses: tcort/github-action-markdown-link-check@v1
        with:
          config-file: '.github/mlc_config.json'
          folder-path: '.'
          use-quiet-mode: 'yes'

      - name: Validate OpenAPI spec
        run: npx --yes @redocly/cli lint packages/apigateway/openapi.yaml --format=github-actions

      - name: Set up Just
        uses: extractions/setup-just@v3

      - name: Verify schemas are in sync
        run: just verify-schemas

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Lint proto files
        run: just proto-lint

      # --- Slow check last (~4 min) ---

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.work.sum

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Pants
        uses: pantsbuild/actions/init-pants@v10
        with:
          gha-cache-key: v1-validation
          named-caches-hash: ${{ hashFiles('packages/*/go.sum', 'packages/stravapipe/uv.lock', 'go.work.sum', 'pants.toml') }}
          cache-lmdb-store: true

      - name: Verify BUILD files
        run: "pants tailor --check ::"

  # ===========================================================================
  # Python: Test, Lint, Type check (via Pants)
  # ===========================================================================
  pants-python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Go needed for pants
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.work.sum

      - name: Set up Pants
        uses: pantsbuild/actions/init-pants@v10
        with:
          gha-cache-key: v1-ci-python
          named-caches-hash: ${{ hashFiles('packages/stravapipe/uv.lock', 'pants.toml') }}
          cache-lmdb-store: true
          base-branch: main

      - name: Test with coverage
        run: "pants --tag='-integration' test --use-coverage packages/stravapipe::"

      - name: Upload Python coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./dist/coverage/python/coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false

      - name: Lint
        run: "pants lint packages/stravapipe::"

      - name: Type check
        run: "pants check packages/stravapipe::"

  # ===========================================================================
  # Go: Test, Lint, Format check (combined for efficiency)
  # Matrix runs packages in parallel
  # ===========================================================================
  go-quality:
    name: Go (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [dispatcher, apigateway, shared]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.work.sum

      - name: Download dependencies
        run: go work sync && go mod download

      - name: Run tests with coverage
        run: |
          cd packages/${{ matrix.package }}
          go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/${{ matrix.package }}/coverage.out
          flags: go-${{ matrix.package }}
          name: go-${{ matrix.package }}-coverage
          fail_ci_if_error: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.2
          working-directory: packages/${{ matrix.package }}
          args: --timeout=5m

      - name: Check Go formatting
        run: |
          cd packages/${{ matrix.package }}
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "❌ The following files need formatting:"
            echo "$unformatted"
            exit 1
          fi

  # ===========================================================================
  # Web/React: Test, Lint, Format, Type check, Build
  # ===========================================================================
  web-quality:
    name: Web/React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: packages/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/web/coverage/lcov.info
          flags: web
          name: web-coverage
          fail_ci_if_error: false

      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: 'true'

  # ===========================================================================
  # Integration Tests: Go + Python against real PostgreSQL
  # Shared ephemeral DB — tmpfs-backed, non-durable for speed
  # ===========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.work.sum

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: packages/stravapipe/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Start optimized Postgres
        run: |
          docker run -d \
            --name postgres \
            -p 5432:5432 \
            --mount type=tmpfs,destination=/var/lib/postgresql/data \
            -e POSTGRES_DB=desirelines_test \
            -e POSTGRES_USER=desirelines \
            -e POSTGRES_PASSWORD=test_password \
            postgis/postgis:17-3.6-alpine \
            postgres \
              -c fsync=off \
              -c full_page_writes=off \
              -c synchronous_commit=off

          until docker exec postgres pg_isready -U desirelines; do
            sleep 0.5
          done

      - name: Run Flyway migrations
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/schemas/database/migrations:/flyway/sql \
            -v ${{ github.workspace }}/schemas/database/callbacks:/flyway/callbacks \
            flyway/flyway \
            -url="jdbc:postgresql://localhost:5432/desirelines_test" \
            -user="desirelines" \
            -password="test_password" \
            -defaultSchema="desirelines" \
            -locations="filesystem:/flyway/sql,filesystem:/flyway/callbacks" \
            -baselineOnMigrate=true \
            -baselineVersion=0 \
            -placeholderReplacement=false \
            migrate

      - name: Go integration tests
        working-directory: packages/apigateway
        env:
          POSTGRES_CONNECTION_STRING: "postgresql://desirelines:test_password@localhost:5432/desirelines_test?search_path=desirelines,extensions,public&application_name=integration-test"
        run: go test -tags=integration -v -race ./adapters/postgres/...

      - name: Install Python dependencies
        working-directory: packages/stravapipe
        run: uv sync --extra dev

      - name: Python integration tests
        working-directory: packages/stravapipe
        run: |
          uv run pytest tests/integration/ -v \
            --db-url="postgresql+psycopg://desirelines:test_password@localhost:5432/desirelines_test?options=-csearch_path%3Ddesirelines,extensions,public"

  # ===========================================================================
  # Terraform: Format, Init, Validate
  # ===========================================================================
  terraform-validate:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read Terraform version
        id: tf-version
        run: echo "version=$(cat terraform/.terraform-version)" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}

      - name: Validate all environments
        run: |
          for env in artifacts; do
            echo "Validating $env environment..."
            cd terraform/environments/$env
            terraform fmt -check
            terraform init -backend=false
            terraform validate
            cd ../../..
          done

      - name: Validate module
        run: |
          cd terraform/modules/desirelines
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Lint Terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for dir in terraform/modules/desirelines terraform/modules/github-actions-wif terraform/environments/artifacts; do
            echo "Linting $dir..."
            cd "$dir"
            tflint --init --config="$(git rev-parse --show-toplevel)/terraform/.tflint.hcl"
            tflint --config="$(git rev-parse --show-toplevel)/terraform/.tflint.hcl"
            cd "$(git rev-parse --show-toplevel)"
          done

      - name: Setup terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.19.0/terraform-docs-v0.19.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz terraform-docs
          sudo mv terraform-docs /usr/local/bin/

      - name: Check terraform-docs
        run: |
          for dir in terraform/modules/desirelines terraform/modules/github-actions-wif; do
            terraform-docs --config terraform/.terraform-docs.yml "$dir" --output-check
          done

