name: Drift Detection

on:
  # Run daily at 8am UTC
  schedule:
    - cron: '0 8 * * *'
  # Allow manual trigger
  workflow_dispatch:

# Only one drift check at a time
concurrency:
  group: drift-detection
  cancel-in-progress: false

jobs:
  detect-drift:
    name: Check ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    # Required for Workload Identity Federation
    permissions:
      contents: read
      id-token: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"

      - name: Terraform Init
        run: |
          cd terraform/environments/${{ matrix.environment }}
          terraform init -input=false

      - name: Check for drift
        id: drift
        run: |
          cd terraform/environments/${{ matrix.environment }}

          # Run plan with detailed exit code
          # Exit 0 = no changes, Exit 1 = error, Exit 2 = changes detected
          set +e
          terraform plan \
            -detailed-exitcode \
            -var="deployment_version=drift-check" \
            -var="gcp_project_id=desirelines-${{ matrix.environment }}" \
            -var="gcp_project_number=${{ secrets.GCP_PROJECT_NUMBER }}" \
            -var="developer_email=${{ secrets.DEVELOPER_EMAIL }}" \
            -input=false \
            -no-color 2>&1 | tee plan_output.txt

          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "drift_detected=false" >> $GITHUB_OUTPUT
            echo "status=clean" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "drift_detected=true" >> $GITHUB_OUTPUT
            echo "status=drift" >> $GITHUB_OUTPUT
          else
            echo "drift_detected=false" >> $GITHUB_OUTPUT
            echo "status=error" >> $GITHUB_OUTPUT
          fi

      - name: Create issue on drift
        if: steps.drift.outputs.drift_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const environment = '${{ matrix.environment }}';
            const title = `Terraform drift detected in ${environment}`;

            // Check for existing open drift issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'terraform,drift'
            });

            const existingIssue = issues.data.find(i => i.title === title);

            if (existingIssue) {
              // Update existing issue with comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Drift still detected as of ${new Date().toISOString()}\n\nRun \`make tf-${environment}-plan\` locally to see details.`
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: `## Drift Detected\n\nThe scheduled drift detection found changes between Terraform state and actual infrastructure in the **${environment}** environment.\n\n### Next Steps\n\n1. Run \`make tf-${environment}-plan\` locally to see the specific changes\n2. Determine if the drift is expected (manual change) or unexpected\n3. Either:\n   - Apply Terraform to reconcile: \`make tf-${environment}-apply\`\n   - Or update Terraform config to match reality\n4. Close this issue once resolved\n\n---\n*This issue was automatically created by the drift detection workflow.*`,
                labels: ['terraform', 'drift', environment]
              });
              console.log('Created new drift issue');
            }

      - name: Summary
        if: always()
        run: |
          echo "### Drift Detection: ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.drift.outputs.status }}" = "clean" ]; then
            echo "✅ No drift detected" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.drift.outputs.status }}" = "drift" ]; then
            echo "⚠️ Drift detected - issue created/updated" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Error during drift check" >> $GITHUB_STEP_SUMMARY
          fi
