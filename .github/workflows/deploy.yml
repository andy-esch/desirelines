name: Build & Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "docs/**"

# Prevent concurrent builds
concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Job 1: Build and Push Docker Images
  # ===========================================================================
  # Builds all Cloud Run services in parallel via matrix:
  # - dispatcher (Go) - Webhook receiver
  # - apigateway (Go) - API for web frontend
  # - stravapipe (Python) - Mono-image for bq-inserter, postgres-writer, backfill
  build-images:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: dispatcher
            context: .
            dockerfile: packages/dispatcher/Dockerfile
          - image: apigateway
            context: .
            dockerfile: packages/apigateway/Dockerfile
          - image: stravapipe
            context: packages/stravapipe
            dockerfile: packages/stravapipe/Dockerfile
    outputs:
      git_sha: ${{ steps.metadata.outputs.git_sha }}

    # Required for Workload Identity Federation
    permissions:
      contents: read
      id-token: write

    env:
      REGISTRY: us-central1-docker.pkg.dev
      REPOSITORY: desirelines-artifacts/desirelines-services

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set deployment metadata
        id: metadata
        run: |
          echo "git_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Docker login to Artifact Registry
        run: gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://${{ env.REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Build tags only: :latest (moving) + :<git-sha> (immutable, what
          # deploys pin to). Stable env tags `prod`/`dev` are NOT set here —
          # they're stamped at deploy time by the desirelines-deploy repo and
          # are what the Artifact Registry cleanup policy protects from
          # age-based deletion (desirelines/terraform/environments/artifacts/
          # main.tf, keep-live-env-images).
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.image }}:${{ steps.metadata.outputs.git_sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.image }}:buildcache,mode=max

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          headline: ":x: *Image build failed* — `${{ matrix.image }}` did not build, nothing was deployed."
          context: "commit `${{ github.sha }}`"

  # ===========================================================================
  # Job 2: Trigger Deploy Repo
  # ===========================================================================
  # Sends repository_dispatch to desirelines-deploy for GitOps deployment
  trigger-deploy:
    name: Trigger deploy repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-images]

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: andy-esch
          repositories: desirelines-deploy

      - name: Trigger deployment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/andy-esch/desirelines-deploy/dispatches \
            --method POST \
            --field event_type=deploy_candidate \
            -f "client_payload[image_tag]=${{ needs.build-images.outputs.git_sha }}" \
            -f "client_payload[env]=dev"

          echo "Triggered deploy repo with image_tag=${{ needs.build-images.outputs.git_sha }}"

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          headline: ":x: *Deploy trigger failed* — images built but `repository_dispatch` to desirelines-deploy did not fire. Deploy repo doesn't know there's a candidate."
          context: "image_tag `${{ needs.build-images.outputs.git_sha }}`"

  # ===========================================================================
  # Job 3: Auto-tag Terraform Modules
  # ===========================================================================
  # When terraform/modules/** files change, compute next tf-N tag and push it.
  # This enables Renovate in desirelines-deploy to detect module updates.
  tag-terraform-modules:
    name: Tag Terraform modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          fetch-tags: true

      - name: Check for module changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^terraform/modules/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Compute and push next tf-N tag
        if: steps.changes.outputs.changed == 'true'
        run: |
          git fetch --tags
          # Find the highest existing tf-N tag
          LATEST=$(git tag -l 'tf-*' | sed 's/tf-//' | sort -n | tail -1)
          if [ -z "$LATEST" ]; then
            NEXT=1
          else
            NEXT=$((LATEST + 1))
          fi
          TAG="tf-${NEXT}"
          echo "Tagging as ${TAG}"
          git tag "$TAG"
          git push origin "$TAG"
