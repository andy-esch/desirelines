name: Build & Deploy

on:
  push:
    branches:
      - main
    # Do not exclude README-only pushes: stravapipe COPYs its README.
    # The versioned build input catalog filters individual images below.

# Prevent concurrent builds
concurrency:
  group: build-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Job 0: Detect which service images actually need rebuilding
  # ===========================================================================
  # Only services whose build inputs changed are rebuilt. The deploy repo can
  # retain an unchanged service's declared digest, avoiding needless revisions.
  #
  # This job ALSO owns `git_sha` — deliberately decoupled from `build-images`,
  # which is skipped entirely when nothing changed. `trigger-deploy` reads git_sha
  # from here so a code-free deploy (e.g. terraform-only) still fires.
  #
  # Input policy lives in scripts/ci/image-build-inputs.json. Workflow or policy
  # changes rebuild every image, including the first signed-provenance baseline.
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      git_sha: ${{ steps.set-matrix.outputs.git_sha }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      any: ${{ steps.set-matrix.outputs.any }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        # Compare the complete push, including multi-commit merges. Missing
        # history fails validation rather than silently skipping image builds.
        with:
          fetch-depth: 0

      - name: Build image matrix from changed services
        id: set-matrix
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python3 scripts/ci/image_release.py matrix \
            --before "$BEFORE" --after "$AFTER" --github-output "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 1: Build and Push Docker Images
  # ===========================================================================
  # Builds all Cloud Run services in parallel via matrix:
  # - dispatcher (Go) - Webhook receiver
  # - apigateway (Go) - API for web frontend
  # - stravapipe (Python) - Mono-image for postgres-writer, deletion-service, backfill
  build-images:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    # Skip the whole job when no service source changed. `git_sha` now lives on the
    # `changes` job, so nothing downstream depends on this producing an output.
    if: needs.changes.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    # Cloud authentication and GitHub-signed provenance; no GHCR package writes.
    permissions:
      contents: read
      id-token: write
      attestations: write

    env:
      REGISTRY: us-central1-docker.pkg.dev
      REPOSITORY: desirelines-artifacts/desirelines-services

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Docker login to Artifact Registry
        run: gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://${{ env.REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@v7
        with:
          # BuildKit reads the exact committed source, ignoring checkout changes
          # (including the credentials file created by Google authentication).
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ needs.changes.outputs.git_sha }}${{ matrix.context_suffix }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          provenance: mode=max
          # Build tags: :latest + :<full-sha>. Tags can move; deployment pins the
          # validated index digest. Stable env tags `prod`/`dev` are NOT set here —
          # they're stamped at deploy time by the desirelines-deploy repo and
          # are what the Artifact Registry cleanup policy protects from
          # age-based deletion (desirelines/terraform/environments/artifacts/
          # main.tf, keep-live-env-images).
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.image }}:${{ needs.changes.outputs.git_sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.image }}:buildcache,mode=max

      - name: Validate pushed image digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.image }}
          COMMIT: ${{ needs.changes.outputs.git_sha }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 scripts/ci/image_release.py validate-digest \
            --image "$IMAGE" --commit "$COMMIT" --digest "$BUILD_DIGEST"

      - name: Attest release image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.image }}
          # Sign the OCI index returned by the push, never a platform child.
          subject-digest: ${{ steps.build.outputs.digest }}
          # Persist signed evidence in GitHub's attestation API. This avoids
          # reliance on expiring workflow artifacts or registry referrer cleanup.
          push-to-registry: false
          create-storage-record: false

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          headline: ":x: *Image release failed* — `${{ matrix.image }}` did not complete build, digest validation and attestation; deployment was not triggered."
          context: "commit `${{ github.sha }}`"

  # ===========================================================================
  # Job 2: Trigger Deploy Repo
  # ===========================================================================
  # Sends repository_dispatch to desirelines-deploy for GitOps deployment
  trigger-deploy:
    name: Trigger deploy repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, build-images]
    # Dispatch only after all selected images are validated and attested, or
    # after a successful comparison selected no images. !cancelled() allows the
    # latter through GitHub's implicit needs-success check.
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && (needs.build-images.result == 'success'
          || (needs.build-images.result == 'skipped' && needs.changes.outputs.any == 'false'))

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: andy-esch
          repositories: desirelines-deploy

      - name: Trigger deployment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/andy-esch/desirelines-deploy/dispatches \
            --method POST \
            --field event_type=deploy_candidate \
            -f "client_payload[image_tag]=${{ needs.changes.outputs.git_sha }}" \
            -f "client_payload[env]=dev"

          echo "Triggered deploy repo with image_tag=${{ needs.changes.outputs.git_sha }}"

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          headline: ":x: *Deploy trigger failed* — images built but `repository_dispatch` to desirelines-deploy did not fire. Deploy repo doesn't know there's a candidate."
          context: "image_tag `${{ needs.changes.outputs.git_sha }}`"

  # ===========================================================================
  # Job 3: Auto-tag Terraform Modules
  # ===========================================================================
  # When terraform/modules/** files change, compute next tf-N tag and push it.
  # This enables Renovate in desirelines-deploy to detect module updates.
  tag-terraform-modules:
    name: Tag Terraform modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          fetch-tags: true

      - name: Check for module changes
        id: changes
        # `schemas/` is here on purpose, not by accident of over-matching. The
        # desirelines module reads two generated files from OUTSIDE its own tree
        # (see bigquery_subscription.tf):
        #   - schemas/proto/desirelines/bigquery/cdc/v1/bq_activity_rows.proto
        #     — the Pub/Sub topic schema definition, and the input to the
        #     filesha256 digest carried in the schema resource's NAME
        #   - schemas/bigquery/activities_live.json — the activities_live table
        #     schema
        # A change to either alters what the module deploys. Matching only
        # `terraform/modules/` cuts no tag for such a change, so the environments
        # stay pinned to the previous tag and the change never ships — then rides
        # along silently with whatever unrelated module edit next cuts a tag.
        #
        # Over-matching (a sport_types.json edit tagging a no-op module version)
        # is cheap; under-matching strands a schema change indefinitely. Err
        # toward tagging.
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(terraform/modules/|schemas/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute and push next tf-N tag
        if: steps.changes.outputs.changed == 'true'
        run: |
          git fetch --tags
          # Find the highest existing tf-N tag
          LATEST=$(git tag -l 'tf-*' | sed 's/tf-//' | sort -n | tail -1)
          if [ -z "$LATEST" ]; then
            NEXT=1
          else
            NEXT=$((LATEST + 1))
          fi
          TAG="tf-${NEXT}"
          echo "Tagging as ${TAG}"
          git tag "$TAG"
          git push origin "$TAG"
