services:
  # ==========================================
  # BACKEND PIPELINE SERVICES
  # Start with: make start (or docker compose up)
  # ==========================================

  dispatcher:
    profiles: ["backend"] # Backend pipeline only
    build:
      context: ./packages/dispatcher
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - GCP_PROJECT_ID=local-dev
      - GCP_PUBSUB_TOPIC=desirelines_activity_events
      - PORT=8080
    env_file:
      - .env
    volumes:
      - ./strava-auth-local.json:/etc/secrets/strava_auth.json:ro
    depends_on:
      pubsub-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--method=HEAD",
          "http://localhost:8080/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  aggregator:
    profiles: ["backend"] # Backend pipeline only
    build:
      context: .
      dockerfile: functions/Dockerfile.aggregator
    ports:
      - "8082:8080"
    environment:
      - FUNCTION_TARGET=main
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - GCP_PROJECT_ID=local-dev
      - GCP_BUCKET_NAME=desirelines_local_testing
    env_file:
      - .env
    volumes:
      - ./strava-auth-local.json:/etc/secrets/strava_auth.json:ro
    depends_on:
      pubsub-bootstrap:
        condition: service_completed_successfully

  bq-inserter:
    profiles: ["backend"] # Backend pipeline only
    build:
      context: ./packages/stravapipe
      dockerfile: Dockerfile.bq_inserter
    ports:
      - "8083:8080"
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - GCP_PROJECT_ID=local-dev
      - GCP_BIGQUERY_DATASET=local_dev_dataset
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      - ./strava-auth-local.json:/etc/secrets/strava_auth.json:ro
    depends_on:
      pubsub-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-writer:
    profiles: ["backend"] # Backend pipeline only
    build:
      context: ./packages/stravapipe
      dockerfile: Dockerfile.postgres_writer
    ports:
      - "8086:8080"
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - GCP_PROJECT_ID=local-dev
      # PostgreSQL connection string for local development
      - POSTGRES_CONNECTION_STRING=postgresql+psycopg://desirelines:local_dev_password@postgres:5432/desirelines_local
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      - ./strava-auth-local.json:/etc/secrets/strava_auth.json:ro
    depends_on:
      pubsub-bootstrap:
        condition: service_completed_successfully
      flyway:
        condition: service_completed_successfully

  # CloudEvent Adapter - wraps PubSub emulator messages with Eventarc-style headers
  # This bridges the gap between PubSub emulator (raw push) and Cloud Run services
  # (which expect CloudEvent headers like ce-type, ce-id, ce-source)
  cloudevent-adapter:
    profiles: ["backend"] # Backend pipeline only
    build:
      context: ./scripts/development/local-dev
      dockerfile: Dockerfile.cloudevent_adapter
    ports:
      - "8087:8080"
    environment:
      - GCP_PROJECT_ID=local-dev
      - GCP_PUBSUB_TOPIC=desirelines_activity_events
      - LOG_LEVEL=INFO
    depends_on:
      - pubsub-emulator
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Bootstrap PubSub topics and subscriptions
  pubsub-bootstrap:
    profiles: ["backend"] # Backend pipeline only
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PROJECT_ID=local-dev
      - TOPIC_NAME=desirelines_activity_events
    volumes:
      - ./scripts/development/local-dev/bootstrap_pubsub.sh:/bootstrap_pubsub.sh:ro
    command: /bootstrap_pubsub.sh
    depends_on:
      - pubsub-emulator
      - cloudevent-adapter

  # Local PubSub emulator for testing
  pubsub-emulator:
    profiles: ["backend"] # Backend pipeline only
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    ports:
      - "8085:8085"
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085

  # PubSub Emulator Web UI for debugging
  pubsub-ui:
    profiles: ["debug", "monitoring"] # Debug profile (use with backend)
    image: ghcr.io/neoscript/pubsub-emulator-ui:latest
    ports:
      - "4200:80"
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - GCP_PROJECT_ID=local-dev
    depends_on:
      - pubsub-emulator

  # ==========================================
  # FRONTEND SERVICES
  # Start with: make start-frontend
  # ==========================================

  # PostgreSQL database (local development)
  # Available in both backend and frontend profiles
  postgres:
    profiles: ["backend", "frontend"]
    image: postgis/postgis:17-3.6-alpine # PostgreSQL 17 with PostGIS 3.6 extension
    ports:
      - "15430:5432"
    environment:
      - POSTGRES_DB=desirelines_local
      - POSTGRES_USER=desirelines
      - POSTGRES_PASSWORD=local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desirelines -d desirelines_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database migrations (runs on startup)
  # Available in both backend and frontend profiles
  flyway:
    profiles: ["backend", "frontend"]
    build:
      context: ./schemas/database
      dockerfile: Dockerfile
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=desirelines_local
      - DB_USER=desirelines
      - DB_PASSWORD=local_dev_password
    depends_on:
      postgres:
        condition: service_healthy

  # API Gateway - serves data to web UI (Go implementation)
  api-gateway:
    profiles: ["frontend"] # Only starts with --profile frontend
    build:
      context: ./packages/apigateway
      dockerfile: Dockerfile
    ports:
      - "8084:8080"
    environment:
      - PORT=8080
      # Data source: local-fixtures (default) or cloud-storage
      - DATA_SOURCE=${DATA_SOURCE:-local-fixtures}
      - LOCAL_FIXTURES_PATH=/app/data/fixtures
      # Allow CORS from local web dev server
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      # Cloud storage configuration (used when DATA_SOURCE=cloud-storage)
      - GCP_PROJECT_ID=${GCP_PROJECT_ID_LIVE:-local-dev}
      - GCP_BUCKET_NAME=${GCP_BUCKET_NAME_LIVE:-desirelines_local_testing}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/.config/gcloud/application_default_credentials.json
      # Database configuration (optional - enables postgres backend)
      - ENABLE_DATABASE=${ENABLE_DATABASE:-false}
      - POSTGRES_CONNECTION_STRING=postgres://desirelines:local_dev_password@postgres:5432/desirelines_local?sslmode=disable
    env_file:
      - .env
    volumes:
      # Mount local fixtures for development
      - ./data/fixtures:/app/data/fixtures:ro
      # Mount gcloud credentials for bucket access (used when DATA_SOURCE=cloud-storage)
      - ~/.config/gcloud:/app/.config/gcloud:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Resource limits for low-memory systems
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

# Named volumes for data persistence
volumes:
  postgres_data:
