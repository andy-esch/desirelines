services:
  # ==========================================
  # BACKEND PIPELINE SERVICES
  # Start with: just start (or docker compose up)
  # ==========================================

  dispatcher:
    profiles: ["backend"] # Backend pipeline only
    build:
      # Build context set to root to allow access to local 'shared' package.
      context: .
      dockerfile: packages/dispatcher/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - GCP_PROJECT_ID=local-dev
      - GCP_PUBSUB_TOPIC=desirelines_activity_events
      - PORT=8080
    env_file:
      - .env.local
    volumes:
      - ./strava-auth-local.json:/etc/secrets/strava_auth.json:ro
    depends_on:
      pubsub-bootstrap:
        condition: service_completed_successfully
    # No healthcheck - distroless has no wget/curl. Cloud Run uses native HTTP probes.

  postgres-writer:
    profiles: ["backend"] # Backend pipeline only
    build:
      context: ./packages/stravapipe
      dockerfile: Dockerfile
    command: ["uvicorn", "stravapipe.cloudrun.postgres_writer_app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8086:8080"
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - GCP_PROJECT_ID=local-dev
      # PostgreSQL connection string for local development (application_name required for observability)
      - POSTGRES_CONNECTION_STRING=postgresql://${POSTGRES_USER_LOCAL}:${POSTGRES_PASSWORD_LOCAL}@postgres:5432/${POSTGRES_DB_LOCAL}?application_name=postgres-writer
      - LOG_LEVEL=INFO
      - ENABLE_CLOUD_LOGGING=true
    env_file:
      - .env.local
    volumes:
      - ./strava-auth-local.json:/etc/secrets/strava_auth.json:ro
    depends_on:
      pubsub-bootstrap:
        condition: service_completed_successfully
      flyway:
        condition: service_completed_successfully

  # Deletion Service - handles user data deletion on Strava deauthorization
  deletion-service:
    profiles: ["backend"] # Backend pipeline only
    build:
      context: ./packages/stravapipe
      dockerfile: Dockerfile
    command: ["uvicorn", "stravapipe.cloudrun.deletion_service_app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8088:8080"
    environment:
      - GCP_PROJECT_ID=local-dev
      - GCP_BIGQUERY_DATASET=local_dev_dataset
      - FIRESTORE_DATABASE=(default)
      - POSTGRES_CONNECTION_STRING=postgresql://${POSTGRES_USER_LOCAL}:${POSTGRES_PASSWORD_LOCAL}@postgres:5432/${POSTGRES_DB_LOCAL}?application_name=deletion-service
      - LOG_LEVEL=INFO
      - ENABLE_CLOUD_LOGGING=true
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/keys/adc.json
    env_file:
      - .env.local
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/tmp/keys/adc.json:ro
    depends_on:
      flyway:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backfill Job - one-shot container for backfilling historical Strava activities
  # Run with: docker compose --profile backfill run --rm backfill
  backfill:
    profiles: ["backfill"]
    build:
      context: ./packages/stravapipe
      dockerfile: Dockerfile
    command: ["python", "-m", "stravapipe.cloudrun.backfill_job"]
    environment:
      - GCP_PROJECT_ID=local-dev
      - POSTGRES_CONNECTION_STRING=postgresql://${POSTGRES_USER_LOCAL}:${POSTGRES_PASSWORD_LOCAL}@postgres:5432/${POSTGRES_DB_LOCAL}?application_name=backfill
      # Set these when running (or in .env.local):
      # - ATHLETE_ID=12345
      # - BACKFILL_YEARS=2023,2024,2025
      # STRAVA_CLIENT_ID and STRAVA_CLIENT_SECRET must be in .env.local
      # Per-user OAuth tokens are fetched from Firestore via ATHLETE_ID
    env_file:
      - .env.local
    volumes:
      - ./strava-auth-local.json:/etc/secrets/strava_auth.json:ro
    depends_on:
      flyway:
        condition: service_completed_successfully

  # CloudEvent Adapter - wraps PubSub emulator messages with Eventarc-style headers
  # This bridges the gap between PubSub emulator (raw push) and Cloud Run services
  # (which expect CloudEvent headers like ce-type, ce-id, ce-source)
  cloudevent-adapter:
    profiles: ["backend"] # Backend pipeline only
    build:
      context: ./local-dev/containers/cloudevent-adapter
      dockerfile: Dockerfile
    ports:
      - "8087:8080"
    environment:
      - GCP_PROJECT_ID=local-dev
      - GCP_PUBSUB_TOPIC=desirelines_activity_events
      - LOG_LEVEL=INFO
    depends_on:
      - pubsub-emulator
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Bootstrap PubSub topics and subscriptions
  pubsub-bootstrap:
    profiles: ["backend"] # Backend pipeline only
    image: google/cloud-sdk:slim # Multi-arch (ARM64 + AMD64)
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PROJECT_ID=local-dev
      - TOPIC_NAME=desirelines_activity_events
    volumes:
      - ./local-dev/bootstrap/pubsub-emulator.sh:/bootstrap_pubsub.sh:ro
    command: /bootstrap_pubsub.sh
    depends_on:
      - pubsub-emulator
      - cloudevent-adapter

  # Local PubSub emulator for testing
  pubsub-emulator:
    profiles: ["backend"]
    image: google/cloud-sdk:emulators # Multi-arch (ARM64 + AMD64)
    ports:
      - "8085:8085"
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085

  # Firebase Emulator Suite (Auth + Firestore)
  # Provides local authentication for development without hitting real Firebase
  firebase-emulators:
    profiles: ["frontend"]
    build:
      context: ./local-dev/containers/firebase-emulators
      dockerfile: Dockerfile
    ports:
      - "9099:9099" # Auth emulator
      - "8089:8080" # Firestore emulator
      - "4000:4000" # Emulator UI
    healthcheck:
      # Auth emulator returns 400 on GET /, so check Firestore emulator which returns 200
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Bootstrap Firebase Auth with pre-baked dev user
  # Creates a user with UID matching the mock Strava athlete ID (123456789)
  # so the user exists in the emulator UI before the first OAuth flow.
  firebase-bootstrap:
    profiles: ["frontend"]
    image: curlimages/curl:8.21.0
    depends_on:
      firebase-emulators:
        condition: service_healthy
    command: >
      sh -c '
        curl -sf -X POST "http://firebase-emulators:9099/identitytoolkit.googleapis.com/v1/projects/desirelines-local/accounts:batchCreate?key=fake-api-key" \
          -H "Content-Type: application/json" \
          -d "{\"users\":[{\"localId\":\"123456789\",\"email\":\"peach.olive.405@example.com\",\"displayName\":\"Peach Olive\"}]}" \
        && echo "✓ Pre-baked dev user: peach.olive.405@example.com (UID: 123456789)"
      '

  # PubSub Emulator Web UI for debugging
  pubsub-ui:
    profiles: ["debug", "monitoring"] # Debug profile (use with backend)
    image: ghcr.io/neoscript/pubsub-emulator-ui:latest
    ports:
      - "4200:80"
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - GCP_PROJECT_ID=local-dev
    depends_on:
      - pubsub-emulator

  # ==========================================
  # FRONTEND SERVICES
  # Start with: just start-frontend
  # ==========================================

  # PostgreSQL database (local development)
  # Available in both backend and frontend profiles
  # NOTE: Uses anonymous volume - data resets on `docker compose down`
  postgres:
    profiles: ["backend", "frontend"]
    image: postgis/postgis:17-3.6-alpine
    platform: linux/amd64
    ports:
      - "15430:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB_LOCAL}
      - POSTGRES_USER=${POSTGRES_USER_LOCAL}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_LOCAL}
    volumes:
      # Anonymous volume - automatically removed on `docker compose down`
      # This ensures a clean slate every startup (no stale migrations)
      - /var/lib/postgresql/data
      # Init script creates login roles (writer, apigateway, flyway, admin)
      - ./schemas/database/local/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      # Combined check: accepting connections AND can execute queries
      # This ensures init scripts have completed before reporting healthy
      test: ["CMD-SHELL", "pg_isready -U desirelines -d desirelines_local && psql -U desirelines -d desirelines_local -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Database migrations (runs on startup)
  # Available in both backend and frontend profiles
  flyway:
    profiles: ["backend", "frontend"]
    build:
      context: ./schemas/database
      dockerfile: Dockerfile
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB_LOCAL}
      - DB_USER=${POSTGRES_USER_LOCAL}
      - DB_PASSWORD=${POSTGRES_PASSWORD_LOCAL}
      # Include callbacks and local-only migrations (role grants, seed data) - not used in prod
      - FLYWAY_LOCATIONS=filesystem:/flyway/sql,filesystem:/flyway/callbacks,filesystem:/flyway/local
      # Belt-and-suspenders: retry connections even if healthcheck passes early
      - FLYWAY_CONNECT_RETRIES=30
    volumes:
      # Mount local-only migrations (not copied in Dockerfile)
      - ./schemas/database/local:/flyway/local:ro
    depends_on:
      postgres:
        condition: service_healthy

  # API Gateway - serves data to web UI (Go implementation)
  api-gateway:
    profiles: ["frontend"] # Only starts with --profile frontend
    build:
      # Build context set to root to allow access to local 'shared' package.
      context: .
      dockerfile: packages/apigateway/Dockerfile
    ports:
      - "8084:8080"
    environment:
      - PORT=8080
      # Allow CORS from local web dev server
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      # Firebase Auth Emulator for real JWT minting/verification in local dev
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulators:9099
      - GCP_PROJECT_ID=desirelines-local
      - FRONTEND_URL=http://localhost:3000
      - AUTH_CALLBACK_URL=http://localhost:8084/api/auth/callback
      - POSTGRES_CONNECTION_STRING=postgresql://${POSTGRES_USER_LOCAL}:${POSTGRES_PASSWORD_LOCAL}@postgres:5432/${POSTGRES_DB_LOCAL}?application_name=apigateway
    env_file:
      - .env.local
    depends_on:
      firebase-emulators:
        condition: service_healthy
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    # Resource limits for low-memory systems
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    # No healthcheck - distroless has no wget/curl. Cloud Run uses native HTTP probes.

# No named volumes - postgres uses anonymous volume for clean-slate local dev
# To preserve data across restarts, switch back to named volume:
#   volumes:
#     postgres_data:
