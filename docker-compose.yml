services:
  # ==========================================
  # BACKEND PIPELINE SERVICES
  # Start with: make start (or docker compose up)
  # ==========================================

  dispatcher:
    profiles: ["backend"] # Backend pipeline only
    build:
      context: ./packages/dispatcher
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - GCP_PROJECT_ID=local-dev
      - GCP_PUBSUB_TOPIC=desirelines_activity_events
      - PORT=8080
    env_file:
      - .env.local
    volumes:
      - ./strava-auth-local.json:/etc/secrets/strava_auth.json:ro
    depends_on:
      pubsub-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--method=HEAD",
          "http://localhost:8080/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  bq-inserter:
    profiles: ["backend"] # Backend pipeline only
    build:
      context: ./packages/stravapipe
      dockerfile: Dockerfile.bq_inserter
    ports:
      - "8083:8080"
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - GCP_PROJECT_ID=local-dev
      - GCP_BIGQUERY_DATASET=local_dev_dataset
      - LOG_LEVEL=INFO
      - ENABLE_CLOUD_LOGGING=true
    env_file:
      - .env.local
    volumes:
      - ./strava-auth-local.json:/etc/secrets/strava_auth.json:ro
    depends_on:
      pubsub-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-writer:
    profiles: ["backend"] # Backend pipeline only
    build:
      context: ./packages/stravapipe
      dockerfile: Dockerfile.postgres_writer
    ports:
      - "8086:8080"
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - GCP_PROJECT_ID=local-dev
      # PostgreSQL connection string for local development (application_name required for observability)
      - POSTGRES_CONNECTION_STRING=postgresql://desirelines:local_dev_password@postgres:5432/desirelines_local?application_name=postgres-writer
      - LOG_LEVEL=INFO
      - ENABLE_CLOUD_LOGGING=true
    env_file:
      - .env.local
    volumes:
      - ./strava-auth-local.json:/etc/secrets/strava_auth.json:ro
    depends_on:
      pubsub-bootstrap:
        condition: service_completed_successfully
      flyway:
        condition: service_completed_successfully

  # CloudEvent Adapter - wraps PubSub emulator messages with Eventarc-style headers
  # This bridges the gap between PubSub emulator (raw push) and Cloud Run services
  # (which expect CloudEvent headers like ce-type, ce-id, ce-source)
  cloudevent-adapter:
    profiles: ["backend"] # Backend pipeline only
    build:
      context: ./scripts/development/local-dev
      dockerfile: Dockerfile.cloudevent_adapter
    ports:
      - "8087:8080"
    environment:
      - GCP_PROJECT_ID=local-dev
      - GCP_PUBSUB_TOPIC=desirelines_activity_events
      - LOG_LEVEL=INFO
    depends_on:
      - pubsub-emulator
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Bootstrap PubSub topics and subscriptions
  pubsub-bootstrap:
    profiles: ["backend"] # Backend pipeline only
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PROJECT_ID=local-dev
      - TOPIC_NAME=desirelines_activity_events
    volumes:
      - ./scripts/development/local-dev/bootstrap_pubsub.sh:/bootstrap_pubsub.sh:ro
    command: /bootstrap_pubsub.sh
    depends_on:
      - pubsub-emulator
      - cloudevent-adapter

  # Local PubSub emulator for testing
  pubsub-emulator:
    profiles: ["backend"]
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    ports:
      - "8085:8085"
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085

  # Firebase Emulator Suite (Auth + Firestore)
  # Provides local authentication for development without hitting real Firebase
  firebase-emulators:
    profiles: ["frontend"]
    build:
      context: ./scripts/development/local-dev
      dockerfile: Dockerfile.firebase-emulators
    ports:
      - "9099:9099" # Auth emulator
      - "8089:8080" # Firestore emulator
      - "4000:4000" # Emulator UI
    healthcheck:
      # Auth emulator returns 400 on GET /, so check Firestore emulator which returns 200
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # PubSub Emulator Web UI for debugging
  pubsub-ui:
    profiles: ["debug", "monitoring"] # Debug profile (use with backend)
    image: ghcr.io/neoscript/pubsub-emulator-ui:latest
    ports:
      - "4200:80"
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - GCP_PROJECT_ID=local-dev
    depends_on:
      - pubsub-emulator

  # ==========================================
  # FRONTEND SERVICES
  # Start with: make start-frontend
  # ==========================================

  # PostgreSQL database (local development)
  # Available in both backend and frontend profiles
  postgres:
    profiles: ["backend", "frontend"]
    image: postgis/postgis:17-3.6-alpine # PostgreSQL 17 with PostGIS 3.6 extension
    ports:
      - "15430:5432"
    environment:
      - POSTGRES_DB=desirelines_local
      - POSTGRES_USER=desirelines
      - POSTGRES_PASSWORD=local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init script creates login roles (writer, apigateway, flyway, admin)
      - ./scripts/development/local-dev/init-db-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desirelines -d desirelines_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database migrations (runs on startup)
  # Available in both backend and frontend profiles
  flyway:
    profiles: ["backend", "frontend"]
    build:
      context: ./schemas/database
      dockerfile: Dockerfile
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=desirelines_local
      - DB_USER=desirelines
      - DB_PASSWORD=local_dev_password
      # Include local-only migrations (role grants, etc.) - not used in prod
      - FLYWAY_LOCATIONS=filesystem:/flyway/sql,filesystem:/flyway/local
    volumes:
      # Mount local-only migrations (not copied in Dockerfile)
      - ./schemas/database/local:/flyway/local:ro
    depends_on:
      postgres:
        condition: service_healthy

  # API Gateway - serves data to web UI (Go implementation)
  api-gateway:
    profiles: ["frontend"] # Only starts with --profile frontend
    build:
      context: ./packages/apigateway
      dockerfile: Dockerfile
    ports:
      - "8084:8080"
    environment:
      - PORT=8080
      # Allow CORS from local web dev server
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      # Firebase Auth Emulator - validates tokens locally without real Firebase
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulators:9099
      - GCP_PROJECT_ID=desirelines-local
      - POSTGRES_CONNECTION_STRING=postgresql://desirelines:local_dev_password@postgres:5432/desirelines_local?application_name=apigateway
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      firebase-emulators:
        condition: service_healthy
    # Resource limits for low-memory systems
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

# Named volumes for data persistence
volumes:
  postgres_data:
