# OTel Collector config for the e2e trace-propagation test harness.
#
# Receives OTLP gRPC from the backend services (dispatcher, bq-inserter,
# postgres-writer, deletion-service), batches briefly, and writes spans
# as newline-delimited JSON to a shared volume the test driver reads.
#
# Tuned for tests, not production: short batch timeout for sub-second
# assertions, debug exporter mirrors everything to stdout for failure
# triage via `docker compose logs otel-collector`.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    # Default is 200ms / 8192 spans — fine for prod, slow for tests
    # that want to assert on spans within a few seconds of the
    # pipeline completing. 500ms is a compromise: small enough that
    # the test driver's poll loop doesn't time out, large enough that
    # we still batch under burst load.
    timeout: 500ms
    send_batch_size: 1024

exporters:
  # Primary sink for the test driver: structured spans, one per line.
  file:
    path: /var/log/otel/spans.jsonl
  # Secondary sink for human debugging: full span contents in
  # `docker compose logs otel-collector` so a CI artifact can capture
  # context even without the JSONL file.
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file, debug]
