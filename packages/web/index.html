<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1724" />
    <meta name="description" content="Desire Lines - Strava Activity Tracking" />
    <title>Desire Lines</title>
    <script>
      // FOUC prevention — set theme class before first paint
      // NOTE: Theme colors below must be kept in sync with `ThemeContext.tsx`
      // and the `--color-bg-body` variable in `tailwind.css`.
      (function () {
        const t = localStorage.getItem("theme");
        const dark =
          t === "dark" ||
          (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        const m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = dark ? "#0f1724" : "#f0f4f8";
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
