[project]
name = "stravapipe"
version = "0.1.0"
description = "Strava data pipeline - fetch, process, and store Strava webhook events"
readme = "README.md"
authors = [
    { name = "Andy Eschbacher", email = "andyesch@protonmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cloudevents>=1.11.0",
    "functions-framework>=3.8.3",
    "google-cloud-bigquery>=3.35.1",
    "google-cloud-logging>=3.11.0",
    "google-cloud-storage>=3.3.0",
    "protobuf>=6.33.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "pytz>=2025.2",
    "requests>=2.32.4",
]

# Development dependencies - Pants-compatible format (PEP 621)
[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "requests-mock>=1.12.1",
    # Linting & Formatting
    "ruff>=0.12.9",
    # Type Checking
    "mypy>=1.17.1",
    "types-pytz>=2025.2.0.20250809",
    "types-requests>=2.32.4.20250809",
    "types-protobuf>=6.32.1.20250918",
    "mypy-protobuf>=3.6.0",
    # Git Hooks (optional - may not need in Pants lockfile)
    "pre-commit>=4.3.0",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
