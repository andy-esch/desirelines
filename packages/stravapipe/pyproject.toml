[project]
name = "stravapipe"
version = "0.1.0"
description = "Strava data pipeline - fetch, process, and store Strava webhook events"
readme = "README.md"
authors = [
    { name = "Andy Eschbacher", email = "andyesch@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cloudevents>=1.11.0",
    "fastapi[standard]>=0.115.0",
    "functions-framework>=3.8.3",
    "google-cloud-bigquery>=3.35.1",
    "google-cloud-bigquery-storage>=2.27.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-logging>=3.11.0",
    "google-cloud-storage>=3.3.0",
    "protobuf>=6.33.2",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "pytz>=2025.2",
    "requests>=2.32.4",
    "sqlalchemy>=2.0.0",
    "psycopg>=3.2.0",
    "psycopg-binary>=3.2.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-gcp-monitoring>=1.8.0a0",
    "opentelemetry-exporter-gcp-trace>=1.8.0a0",
    "opentelemetry-resourcedetector-gcp>=1.8.0a0",
    "polyline>=2.0.4",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "pybreaker>=1.4.1",
]

# Development dependencies - Pants-compatible format
# Note: Since these are extras, use 'uv sync --extra dev' or 'uv pip install -e ".[dev]"' to install them.
[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "requests-mock>=1.12.1",
    # Linting & Formatting
    "ruff>=0.12.9",
    # Type Checking
    "mypy>=1.17.1",
    "types-pytz>=2025.2.0.20250809",
    "types-requests>=2.32.4.20250809",
    "types-protobuf>=6.32.1.20250918",
    "mypy-protobuf>=3.6.0",
    # Git Hooks (optional - may not need in Pants lockfile)
    "pre-commit>=4.3.0",
]

[tool.uv]
# Single source of truth for the uv version, consumed by three places:
#   1. uv itself - it refuses to run if the local uv doesn't match, so a dev
#      machine can't silently write a uv.lock the pinned production uv can't read
#      (uv.lock carries a format `revision`, and older uv can't always read a
#      newer one).
#   2. CI - both `setup-uv` steps read it via `version-file:`.
#   3. Dockerfile - `ghcr.io/astral-sh/uv:<tag>` must be kept equal to this;
#      Renovate bumps both in one PR (see the "uv" group in renovate.json).
# Exact pin, not a floor: allowing devs to run *ahead* of the Dockerfile tag is
# the direction that breaks the production image.
required-version = "==0.12.1"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv_build]
# Include py.typed marker for PEP 561 compliance
include = ["src/stravapipe/py.typed"]

# ==========================================
# Ruff Configuration (Linting & Formatting)
# ==========================================
[tool.ruff]
src = ["src"]
extend-exclude = [
    "*.ipynb",
    "src/stravapipe/types/generated/",  # Exclude generated protobuf code
]
line-length = 88
target-version = "py313"


[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "RUF",   # ruff-specific rules
    "PT",    # flake8-pytest-style
    "SIM",   # flake8-simplify
    "PERF",  # perflint
    "TRY",   # tryceratops — exception-handling antipatterns
    "PTH",   # flake8-use-pathlib — prefer Path over os.path
    "PL",    # Pylint subset
    "RET",   # flake8-return — cleaner return patterns
    "ASYNC", # flake8-async — async-safety checks (FastAPI apps)
    "PIE",   # flake8-pie — misc cleanup rules
    # Intentionally skipping TCH — project decision, no TYPE_CHECKING guards
    # (see memory `feedback_no_type_checking_guard.md`).
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "TRY003", # long exception messages outside exception class — pedantic for Python (tryceratops itself flags this as noisy); prefer readable raise-site messages over one-off exception subclasses
]

[tool.ruff.lint.per-file-ignores]
# Magic-value comparisons are idiomatic in test assertions (`assert count == 2`)
# and refactoring them into named constants adds noise without clarity.
# Deferred imports inside test functions are required to import modules under
# test *after* patches are applied (module-level state gets frozen at import).
#
# Two patterns: `tests/**` matches when ruff runs from inside this package
# (e.g. `just py-lint` via uv, cwd=packages/stravapipe). `**/tests/**` matches
# when ruff runs from the repo root (e.g. `pants lint`, which passes
# packages/stravapipe/tests/... paths).
"tests/**" = ["PLR2004", "PLC0415"]
"**/tests/**" = ["PLR2004", "PLC0415"]
# Not every test lives in a `tests/` dir — `schemas/bigquery` and `scripts/ops`
# keep their tests beside the code they exercise, so those need matching on the
# filename instead. Same rationale as above.
"**/test_*.py" = ["PLR2004", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["stravapipe", "tests"]
force-sort-within-sections = true

[tool.ruff.lint.pylint]
# Default max-args is 5 which is too tight for config-heavy FastAPI handlers
# and dependency-injection constructors. 8 allows the common pattern without
# being so generous the rule stops catching genuine over-parameterized functions.
max-args = 8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ==========================================
# Pytest Configuration
# ==========================================
[tool.pytest.ini_options]
# Paths are relative to rootdir, which is this directory (pytest picks the
# directory holding this file). Repo-root-relative values silently matched
# nothing and made pytest fall back to recursive collection.
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]
addopts = "--import-mode=importlib"

# ==========================================
# Coverage Configuration
# ==========================================
[tool.coverage.run]
omit = [
    # Exclude generated protobuf code - machine-generated, tested via usage
    "*/types/generated/*_pb2.py",
    "*/types/generated/*_pb2.pyi",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ==========================================
# MyPy Configuration (Type Checking)
# ==========================================
[tool.mypy]
mypy_path = ["src"]
packages = ["stravapipe"]
explicit_package_bases = true
namespace_packages = true
strict = true

# Generated protobuf code — machine-generated, not worth annotating.
# Disables:
# - `misc`: protoc stubs declare __slots__ = () but fields are dynamically
#   managed by the descriptor layer.
# - `type-arg`: generated stubs reference bare `Mapping` without parameters.
# - `no-untyped-def`, `no-untyped-call`: accessors/constructors in the
#   generated stubs are not fully annotated.
[[tool.mypy.overrides]]
module = "stravapipe.types.generated.*"
disable_error_code = ["misc", "type-arg", "no-untyped-def", "no-untyped-call"]

# Deeply-nested generated protos with the same nested-message name at
# multiple paths (e.g. bq_activities_pb2 has Segment/Athlete/Activity
# submessages inside both segment_efforts and best_efforts) hit known
# protoc-gen-pyi limitations where intra-file forward references aren't
# always resolved. Runtime _pb2.py is correct; only the .pyi stub fails
# typecheck. Narrow override — keeps the simpler protos under the
# slightly-relaxed-but-still-checked rules above.
[[tool.mypy.overrides]]
module = "stravapipe.types.generated.bq_activities_pb2"
ignore_errors = true

# The generate_proto test lives beside the generator (schemas/bigquery/) rather
# than under a `tests/` package. Under Pants' `/schemas` source root it is the
# module `bigquery.test_generate_proto` and imports the generator as the bare
# `generate_proto` (so the standalone `cd schemas/bigquery && pytest` workflow
# in its docstring keeps working) — which mypy can't resolve to the namespaced
# `bigquery.generate_proto`. The test is gated by *running* under `pants test`
# (pytest catches its bugs); mypy on it adds little, so ignore it here. The
# generator itself stays fully type-checked.
[[tool.mypy.overrides]]
module = ["bigquery.test_generate_proto", "test_generate_proto"]
ignore_errors = true

# Tests: idiomatic pytest (`def test_foo():` without `-> None`), heavy use
# of Mock/patch which return Any. Keep strict type safety for the bodies
# (still catches real bugs in test logic) but drop the annotation ceremony
# around the function and call signatures.
#
# `just py-typecheck` scopes to `src/` so this section appears "unused" and
# mypy emits a note; `pants check` covers tests and needs the relaxation. The
# `just py-typecheck` recipe passes `--no-warn-unused-configs` to silence the
# note without masking real unused configs in CI.
[[tool.mypy.overrides]]
module = ["stravapipe.tests.*", "tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
disable_error_code = ["attr-defined"]

# Ignore missing imports for external libraries.
# The opentelemetry-exporter-gcp-* and opentelemetry-resourcedetector-gcp
# packages are installed in the dev venv but absent from Pants' mypy resolve,
# so pants reports `import-not-found` while `just py-typecheck` does not.
# Marking them ignore_missing_imports = true keeps both environments in sync.
[[tool.mypy.overrides]]
module = [
    "google.cloud.*",
    "google.auth.*",
    "google.api_core.*",
    "opentelemetry.exporter.*",
    "opentelemetry.resourcedetector.*",
]
ignore_missing_imports = true

# pyshp (imported as `shapefile`) ships no type stubs and is a uv inline-script
# dependency of load_census_regions.py, not part of the stravapipe resolve — so
# mypy can neither import it nor find stubs. Only Pants type-checks that script
# (`just py-typecheck` scopes to packages/stravapipe), so this keeps `pants check
# scripts/ops::` green without weakening checking of the script's own logic.
[[tool.mypy.overrides]]
module = ["shapefile"]
ignore_missing_imports = true

# schemas/bigquery keeps its test beside the code. Under Pants' `/schemas`
# source root it's module `bigquery.test_generate_proto`, and it imports the
# generator as bare `generate_proto` (not `bigquery.generate_proto`) so the
# standalone `cd schemas/bigquery && pytest` workflow keeps working — which
# mypy can't resolve. It's a test (gated by *running*, not by types), so ignore
# it wholesale; the generator itself (`bigquery.generate_proto`) stays fully
# type-checked.
[[tool.mypy.overrides]]
module = ["bigquery.test_generate_proto"]
ignore_errors = true
