version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard  # Use standard set of linters as baseline
  enable:
    # Additional quality linters
    - misspell        # Find commonly misspelled English words
    - revive          # Fast, configurable, extensible linter (replaces golint)
    - gosec           # Security-focused linter
    - unconvert       # Remove unnecessary type conversions
    - unparam         # Find unused function parameters
    - gocyclo         # Check cyclomatic complexity
    - dupl            # Check for code duplication
    - goconst         # Find repeated strings that could be constants
    - bodyclose       # Check HTTP response body is closed
    - nilerr          # Find code returning nil even if it checks err != nil
    - errorlint       # Find code that will cause problems with Go 1.13+ error wrapping
    - copyloopvar     # Check for pointers to loop variables
    - gocritic        # The most extensive checks for bugs, performance, and style
    - staticcheck     # Catch bugs and performance issues
    - prealloc        # Finds slice declarations that could be pre-allocated
    - nolintlint      # clean up stale //nolint directives
    - whitespace      # Tool for detection of leading and trailing whitespace
    - sloglint        # Enforce slog best practices
    - wrapcheck       # Require wrapping errors returned from other packages
    - contextcheck    # Detect non-inherited contexts (loses cancellation/deadline)
    - exhaustive      # Require exhaustive switch/map on enum-like types
    - forbidigo       # Ban specific identifiers (fmt.Println, panic outside init/main)

  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
    govet:
      enable:
        - shadow
      settings:
        shadow:
          strict: true
    gocyclo:
      min-complexity: 15
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
      ignore-tests: true
    misspell:
      locale: US
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: dot-imports
        - name: blank-imports
        - name: exported
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: time-naming
        - name: indent-error-flow
        - name: superfluous-else
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - ifElseChain
        - unnamedResult
        - httpNoBody
    wrapcheck:
      # Allow returning errors from stdlib `errors` package helpers verbatim
      # (these are already well-named by the constructor, e.g. errors.New,
      # errors.Join, errors.Unwrap). Third-party passthroughs still required
      # to be wrapped so the caller can trace the origin.
      ignore-sig-regexps:
        - "\\.Errorf\\("
      ignore-package-globs:
        - "errors"
    forbidigo:
      forbid:
        - pattern: "^fmt\\.Print(ln|f)?$"
          msg: "use the slog logger instead of fmt.Print*"
        - pattern: "^panic$"
          msg: "return an error or use log.Fatal in main/init instead of panic"
      exclude-godoc-examples: true
      analyze-types: true
    exhaustive:
      # Proto-generated enums always have an UNSPECIFIED zero value that legitimately
      # falls through to `default`. Allow `default` to satisfy exhaustiveness.
      default-signifies-exhaustive: true

formatters:
  enable:
    - gofmt           # Check code is gofmt-ed
    - goimports       # Check imports are formatted

issues:
  max-issues-per-linter: 0  # Show all issues
  max-same-issues: 0        # Show all occurrences
