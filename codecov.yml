coverage:
  precision: 2
  round: down
  range: "60...90"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
        if_ci_failed: error
      python:
        flags: [python]
        target: auto
        threshold: 1%
      go-apigateway:
        flags: [go-apigateway]
        target: auto
        threshold: 2%
      go-dispatcher:
        flags: [go-dispatcher]
        target: auto
        threshold: 1%
      go-shared:
        flags: [go-shared]
        target: auto
        threshold: 1%
      web:
        flags: [web]
        target: auto
        threshold: 1%

    patch:
      default:
        target: auto
        threshold: 0%
        informational: true
        if_ci_failed: error

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

flags:
  python:
    paths:
      - packages/stravapipe/src
  go-apigateway:
    paths:
      - packages/apigateway
  go-dispatcher:
    paths:
      - packages/dispatcher
  go-shared:
    paths:
      - packages/shared
  web:
    paths:
      - packages/web/src

ignore:
  - "**/*_pb2.py"
  - "**/*_pb2.pyi"
  - "**/generated/**"
  - "**/*.pb.go"
  - "**/testdata/**"
  # Thin main() that only calls singlechecker.Main — singlechecker
  # calls os.Exit, so the wrapper can't be unit-tested; the analyzer
  # it delegates to (packages/shared/otel/lintpub) is well-covered.
  - "packages/shared/cmd/lintpub/main.go"
  - "packages/web/src/**/*.test.*"
  - "packages/web/src/**/*.spec.*"
