repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: check-yaml
  - id: check-json
  - id: check-merge-conflict
  - id: end-of-file-fixer
  - id: trailing-whitespace

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.12.9
  hooks:
  - id: ruff
    args: [--fix]
  - id: ruff-format

# Local hooks for Web (React) to ensure version alignment with package.json
- repo: local
  hooks:
  - id: web-eslint
    name: Web ESLint
    # Run eslint from the project root, pointing to the local config.
    # We use 'npm exec' to use the locally installed eslint binary.
    entry: npm exec --prefix packages/web -- eslint --config packages/web/eslint.config.js --fix
    language: system
    files: ^packages/web/.*\.(js|ts|jsx|tsx)$
    types: [file]

  - id: web-prettier
    name: Web Prettier
    # Run prettier from the project root, pointing to local config and ignore file.
    entry: npm exec --prefix packages/web -- prettier --config packages/web/.prettierrc.json --ignore-path packages/web/.prettierignore --write
    language: system
    files: ^packages/web/.*\.(js|ts|jsx|tsx|json|css|html)$
    types: [file]

# Terraform validation and formatting
- repo: https://github.com/antonbabenko/pre-commit-terraform
  rev: v1.96.3
  hooks:
  - id: terraform_fmt
  - id: terraform_validate
    args:
    - --hook-config=--retry-once-with-cleanup=true
